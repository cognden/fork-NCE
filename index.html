<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新概念英语学习</title>
    <link rel="stylesheet" href="static/style.css">
  </head>

  <body>
    <div class="container">
      <nav>
        <div>
          <a href="#NCE1" data-book="1">壹</a>
          <a href="#NCE2" data-book="2">贰</a>
          <a href="#NCE3" data-book="3">叁</a>
          <a href="#NCE4" data-book="4">肆</a>
        </div>
      </nav>
      
      <main id="content">
        <div class="header">
          <h1>新概念英语学习</h1>
          <div class="now-playing" id="now-playing">暂无播放</div>
        </div>
      </main>
      
      <aside>
        <div class="aside-content">
          <div class="book-cover">
            <img id="book-cover-img" src="images/NCE1.jpg" alt="课本封面">
          </div>
          
          <div class="audio-controls">
            <div class="song-info">
              <div class="song-title" id="song-title">未选择课程</div>
              <div class="song-artist" id="song-artist">请先选择课程</div>
            </div>
            
            <div class="control-buttons">
              <button class="control-button" id="prev-button">⏮</button>
              <button class="control-button main" id="play-pause-button">▶</button>
              <button class="control-button" id="next-button">⏭</button>
            </div>
            
            <div class="additional-controls">
              <div class="other-controls">
                <div class="toggle-controls">
                  <button class="toggle-button" id="translate-button">翻译</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
    </div>
    
    <div class="book-selector" id="book-selector">
      <div class="book-selector-content">
        <div class="book-selector-header">
          <h2 id="selector-title">选择课程</h2>
          <button class="close-button" id="close-selector">×</button>
        </div>
        <div class="lesson-list" id="lesson-list">
        </div>
      </div>
    </div>
    
    <audio id="player"></audio>

    <script src="static/script.js"></script>
  </body>
</html>
